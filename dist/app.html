<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8f9fc" />
    <meta name="description" content="SYNASE AI — Decision Intelligence Console" />
    <title>SYNASE AI · Console</title>
    <link rel="icon" type="image/svg+xml" href="./src/assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="./src/styles/app.css" />
    <link rel="stylesheet" href="./src/styles/home/dashboard.css" />
    <link rel="stylesheet" href="./src/styles/integrations/integrations.css" />
    <script>
      /* set the theme before first paint so there is no flash */
      (function () {
        try {
          var saved = localStorage.getItem('synase-theme');
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="app" aria-live="polite"></div>
    <noscript>SYNASE AI requires JavaScript to run this frontend prototype.</noscript>
    <script type="module" src="./src/app/main.js"></script>
  </body>
</html>
